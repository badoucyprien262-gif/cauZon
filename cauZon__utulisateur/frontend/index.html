    <style>
      :root {
        --cauzon-duree-btn: 140ms;
        --cauzon-duree-carte: 200ms;
        --cauzon-duree-page: 280ms;
        --cauzon-courbe-naturelle: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Empêche tout écran noir ou blanc pendant le chargement initial et verrouille la sélection de l'interface */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #6B1124;
        overflow-y: auto;
        touch-action: auto;
        -webkit-overflow-scrolling: touch;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        overscroll-behavior-y: none;
      }
      #root {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 100%;
        position: relative;
        overflow-y: auto;
      }

      /* 🚀 Micro-interactions tactiles : suppression du délai de 300ms au tap */
      button,
      [role="button"],
      .cauzon-btn,
      .cauzon-card,
      a,
      [tabindex="0"] {
        touch-action: manipulation !important;
        -webkit-tap-highlight-color: transparent !important;
      }

      /* ⚡ Boutons : compression active:scale-96, durée 140ms, courbe naturelle */
      button:not(:disabled),
      [role="button"]:not([aria-disabled="true"]),
      .cauzon-btn {
        touch-action: manipulation !important;
        -webkit-tap-highlight-color: transparent !important;
        will-change: transform, opacity;
        transition: transform var(--cauzon-duree-btn) var(--cauzon-courbe-naturelle),
                    opacity var(--cauzon-duree-btn) var(--cauzon-courbe-naturelle) !important;
      }
      button:not(:disabled):active,
      [role="button"]:not([aria-disabled="true"]):active,
      .cauzon-btn:active {
        transform: scale(0.96) !important;
      }

      /* 📑 Cartes documentaires : compression active:scale-98, durée 200ms, courbe naturelle */
      .cauzon-card {
        touch-action: manipulation !important;
        -webkit-tap-highlight-color: transparent !important;
        will-change: transform, opacity;
        transition: transform var(--cauzon-duree-carte) var(--cauzon-courbe-naturelle),
                    opacity var(--cauzon-duree-carte) var(--cauzon-courbe-naturelle) !important;
      }
      .cauzon-card:active {
        transform: scale(0.98) !important;
      }

      /* 🎬 Transition de page fluide : fondu + léger glissement vertical 280ms */
      @keyframes cauzonPageTransition {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .cauzon-page-transition {
        animation: cauzonPageTransition var(--cauzon-duree-page) var(--cauzon-courbe-naturelle) forwards !important;
        will-change: transform, opacity !important;
      }

      /* ⚓ Stabilité absolue de la barre de navigation inférieure (zéro saut / clignotement) */
      div[style*="borderTopWidth"][style*="bottom: 0"],
      div[style*="border-top-width"][style*="bottom: 0px"],
      nav[role="navigation"] {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        z-index: 9999 !important;
        transform: translateZ(0) !important;
        -webkit-transform: translateZ(0) !important;
        will-change: transform !important;
        backface-visibility: hidden !important;
        -webkit-backface-visibility: hidden !important;
        contain: layout paint !important;
      }

      /* ♿ Accessibilité & Performance : Respect strict de prefers-reduced-motion (Zéro transition: all) */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Défilement vertical strict & respect du ratio A4 sans compression */
      .cauzon-pdf-scroll-container {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        overflow-y: scroll !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-x pan-y pinch-zoom !important;
        padding-bottom: 120px !important;
        overscroll-behavior-y: contain !important;
        box-sizing: border-box !important;
      }
      .cauzon-page-wrapper {
        display: block !important;
        width: 100% !important;
        max-width: 800px !important;
        margin: 0 auto 16px auto !important;
        flex-shrink: 0 !important;
        box-sizing: border-box !important;
        position: relative !important;
      }
      .cauzon-page-wrapper canvas {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        flex-shrink: 0 !important;
      }
      /* 🛡️ Sécurité DRM cauZon : Blocage absolu de la copie et du téléchargement */
      .cauzon-mobile-scroll-container,
      .cauzon-pdf-scroll-container,
      .cauzon-page-wrapper,
      canvas {
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-user-drag: none !important;
      }
      @media print {
        html, body, #root {
          display: none !important;
          visibility: hidden !important;
        }
      }
    </style>
    <!-- 📲 Capture Précoce de l'Événement PWA beforeinstallprompt -->
    <script>
      window.__cauzonDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__cauzonDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('cauzon-pwa-installable'));
      });
      window.addEventListener('appinstalled', function() {
        window.__cauzonDeferredPrompt = null;
      });
    </script>

  <body>
    <div id="root"></div>
    <script>
      // 🛡️ Bouclier Sécurité cauZon : Anti-Inspection & Anti-Fuite Web
      (function() {
        // 1. Désactiver le clic droit
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // 2. Intercepter et bloquer les raccourcis d'inspection et de copie/sauvegarde
        document.addEventListener('keydown', function(e) {
          // F12 (DevTools)
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
          }

          // Ctrl+U, Ctrl+S, Ctrl+Shift+I, Ctrl+Shift+J (ou équivalents Mac avec Cmd/Meta)
          var isCtrlOrMeta = e.ctrlKey || e.metaKey;
          if (
            (isCtrlOrMeta && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
            (isCtrlOrMeta && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J'))
          ) {
            e.preventDefault();
            return false;
          }
        });
      })();
    </script>
    <!-- 🚀 Enregistrement du Service Worker PWA cauZon -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('✅ [PWA] Service Worker cauZon actif. Scope:', registration.scope);
            })
            .catch(function(error) {
              console.warn('⚠️ [PWA] Échec enregistrement Service Worker:', error);
            });
        });
      }
    </script>
