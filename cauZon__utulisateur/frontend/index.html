<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1.00001, viewport-fit=cover" />
    <title>cauZon — Documents & Épreuves Académiques</title>
    <meta name="theme-color" content="#6B1124" />
    <meta name="description" content="Vos cours et ressources académiques partout avec vous. Épreuves, annales corrigées et cours universitaires certifiés." />
    <!-- PWA & Haute Résolution Android & iOS Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png" />
    <link rel="icon" href="/favicon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="cauZon" />
    <!-- Google Identity Services (GIS) Web -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Empêche tout écran noir ou blanc pendant le chargement initial et verrouille la sélection de l'interface */
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #6B1124;
        overflow-y: auto;
        touch-action: auto;
        -webkit-overflow-scrolling: touch;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 🛡️ Bouclier Sécurité cauZon : Anti-Inspection & Anti-Fuite Web
      (function() {
        // 1. Désactiver le clic droit
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // 2. Intercepter et bloquer les raccourcis d'inspection et de copie/sauvegarde
        document.addEventListener('keydown', function(e) {
          // F12 (DevTools)
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
          }

          // Ctrl+U, Ctrl+S, Ctrl+Shift+I, Ctrl+Shift+J (ou équivalents Mac avec Cmd/Meta)
          var isCtrlOrMeta = e.ctrlKey || e.metaKey;
          if (
            (isCtrlOrMeta && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
            (isCtrlOrMeta && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J'))
          ) {
            e.preventDefault();
            return false;
          }
        });
      })();
    </script>
  </body>
</html>
