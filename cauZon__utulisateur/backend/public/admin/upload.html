<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cauZon Admin — Upload Documents R2</title>
  <style>
    :root {
      --bordeaux: #7F011F;
      --bordeaux-dark: #5c0116;
      --bordeaux-light: rgba(127,1,31,0.08);
      --surface: #0f0f13;
      --surface-2: #18181f;
      --surface-3: #1e1e28;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f5;
      --text-secondary: rgba(240,240,245,0.55);
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--surface);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--bordeaux-dark) 0%, var(--bordeaux) 100%);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      color: #fff;
    }

    .logo span { color: rgba(255,255,255,0.65); font-weight: 400; font-size: 14px; margin-left: 12px; }

    .badge-admin {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #fff;
    }

    /* ── Layout ──────────────────────────────────────────── */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── Cards ───────────────────────────────────────────── */
    .card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::before {
      content: '';
      width: 3px;
      height: 18px;
      background: var(--bordeaux);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── Auth Section ─────────────────────────────────────── */
    #auth-section { display: flex; flex-direction: column; gap: 16px; }

    /* ── Form ────────────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="text"], input[type="number"], input[type="password"], select, textarea {
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--bordeaux);
    }

    /* ── Drop Zone ───────────────────────────────────────── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface-3);
      position: relative;
    }

    #drop-zone:hover, #drop-zone.dragover {
      border-color: var(--bordeaux);
      background: var(--bordeaux-light);
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    #drop-zone .dz-icon { font-size: 40px; margin-bottom: 12px; }

    #drop-zone .dz-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    #drop-zone .dz-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    #file-selected {
      display: none;
      background: var(--bordeaux-light);
      border: 1px solid var(--bordeaux);
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--text);
    }

    /* ── Compression Preview ─────────────────────────────── */
    #compression-preview {
      display: none;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
    }

    .compression-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      text-align: center;
    }

    .size-box {
      background: var(--surface-2);
      border-radius: 10px;
      padding: 16px;
    }

    .size-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .size-value {
      font-size: 24px;
      font-weight: 900;
      color: var(--text);
    }

    .size-value.compressed { color: var(--success); }

    .arrow { font-size: 24px; color: var(--text-secondary); }

    .economy-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--success), #16a34a);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 8px;
      margin-top: 10px;
    }

    /* ── Progress Bar ────────────────────────────────────── */
    #progress-section { display: none; }

    .progress-bar {
      height: 6px;
      background: var(--surface-3);
      border-radius: 3px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--bordeaux), #e11d48);
      border-radius: 3px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-text {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--bordeaux), #c0142a);
      color: #fff;
      width: 100%;
      padding: 14px;
      font-size: 15px;
      margin-top: 20px;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover { border-color: var(--bordeaux); }

    /* ── Result ──────────────────────────────────────────── */
    #result-section { display: none; }

    .result-success {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: var(--radius);
      padding: 20px;
    }

    .result-error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius);
      padding: 20px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .result-success .result-title { color: var(--success); }
    .result-error .result-title { color: var(--error); }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .result-row:last-child { border-bottom: none; }
    .result-row .key { color: var(--text-secondary); }
    .result-row .val { font-weight: 600; font-family: monospace; font-size: 12px; }

    .file-key-box {
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-top: 12px;
      color: #60a5fa;
    }

    /* ── Test R2 ─────────────────────────────────────────── */
    #r2-status { font-size: 13px; color: var(--text-secondary); margin-top: 10px; }

    /* ── Toast ───────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 13px;
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 9999;
      max-width: 360px;
    }

    #toast.visible { transform: translateY(0); }
    #toast.success { border-color: var(--success); color: var(--success); }
    #toast.error { border-color: var(--error); color: var(--error); }
  </style>
</head>
<body>

<header>
  <div class="logo">cauZon <span>Dashboard Admin</span></div>
  <div class="badge-admin">R2 STORAGE</div>
</header>

<main>

  <!-- ── Auth ────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Authentification Admin</div>
    <div id="auth-section">
      <div class="form-group">
        <label>Clé Admin (X-Admin-Key)</label>
        <input type="password" id="admin-key" placeholder="cauzon_admin_r2_secret_..." />
      </div>
      <div class="form-group">
        <label>URL du Backend cauZon</label>
        <input type="text" id="backend-url" value="http://localhost:3001" />
      </div>
      <div style="display:flex;gap:12px;margin-top:4px;">
        <button class="btn btn-secondary" onclick="testerConnexionR2()">🔌 Tester la connexion R2</button>
      </div>
      <div id="r2-status"></div>
    </div>
  </div>

  <!-- ── Upload ───────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Upload de Document PDF</div>

    <!-- Drop Zone -->
    <div id="drop-zone">
      <input type="file" id="pdf-input" accept="application/pdf" onchange="onFileSelected(this.files[0])" />
      <div class="dz-icon">📄</div>
      <div class="dz-title">Déposez votre PDF ici</div>
      <div class="dz-subtitle">ou cliquez pour parcourir — max 50 Mo</div>
    </div>
    <div id="file-selected"></div>

    <!-- Compression Preview -->
    <div id="compression-preview">
      <div class="card-title" style="margin-bottom:16px;">Aperçu de Compression</div>
      <div class="compression-grid">
        <div class="size-box">
          <div class="size-label">Taille d'origine</div>
          <div class="size-value" id="orig-size">—</div>
        </div>
        <div class="arrow">→</div>
        <div class="size-box">
          <div class="size-label">Taille optimisée</div>
          <div class="size-value compressed" id="comp-size">—</div>
        </div>
      </div>
      <div style="text-align:center;margin-top:14px;">
        <span class="economy-badge" id="economy-badge">—% d'économie</span>
      </div>
    </div>

    <!-- Métadonnées -->
    <div class="form-grid" style="margin-top:24px;">
      <div class="form-group full">
        <label>Clé de Stockage R2 *</label>
        <input type="text" id="storage-key" placeholder="miage_l1/algebre_lineaire.pdf" />
      </div>
      <div class="form-group">
        <label>Titre du document</label>
        <input type="text" id="doc-titre" placeholder="Algèbre Linéaire — L1 MIAGE" />
      </div>
      <div class="form-group">
        <label>Catégorie</label>
        <input type="text" id="doc-categorie" placeholder="Mathématiques" />
      </div>
      <div class="form-group">
        <label>Niveau académique</label>
        <input type="text" id="doc-niveau" placeholder="Licence 1" />
      </div>
      <div class="form-group">
        <label>Prix (FCFA)</label>
        <input type="number" id="doc-prix" placeholder="500" min="0" step="50" />
      </div>
      <div class="form-group full">
        <label>ID Supabase existant (pour mise à jour)</label>
        <input type="text" id="doc-id" placeholder="uuid-du-document (optionnel)" />
      </div>
    </div>

    <!-- Progress -->
    <div id="progress-section">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">Compression et upload en cours…</div>
    </div>

    <button class="btn btn-primary" id="upload-btn" onclick="lancerUpload()" disabled>
      ⬆️ Compresser &amp; Uploader vers R2
    </button>
  </div>

  <!-- ── Résultat ──────────────────────────────────────────── -->
  <div class="card" id="result-section">
    <div class="card-title">Résultat de l'Upload</div>
    <div id="result-content"></div>
  </div>

</main>

<div id="toast"></div>

<script>
  let selectedFile = null;

  // ── Drag & Drop ───────────────────────────────────────────
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f && f.type === 'application/pdf') onFileSelected(f);
    else afficherToast('Seuls les fichiers PDF sont acceptés.', 'error');
  });

  function onFileSelected(file) {
    if (!file) return;
    selectedFile = file;

    const sizeMo = (file.size / (1024 * 1024)).toFixed(2);
    document.getElementById('file-selected').style.display = 'block';
    document.getElementById('file-selected').innerHTML =
      `📄 <strong>${file.name}</strong> — ${sizeMo} Mo`;

    // Auto-remplissage de la clé de stockage depuis le nom de fichier
    if (!document.getElementById('storage-key').value) {
      const slug = file.name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9._-]/g, '');
      document.getElementById('storage-key').value = slug;
    }

    // Afficher l'aperçu de compression (estimation côté client)
    const estComp = estimerCompression(file.size);
    document.getElementById('orig-size').textContent = formatTaille(file.size);
    document.getElementById('comp-size').textContent = formatTaille(estComp);
    const eco = Math.round(((file.size - estComp) / file.size) * 100);
    document.getElementById('economy-badge').textContent = `~${Math.max(0, eco)}% d'économie estimée`;
    document.getElementById('compression-preview').style.display = 'block';

    document.getElementById('upload-btn').disabled = false;
  }

  /** Estimation côté client de la taille compressée (pdf-lib ≈ 10-40% de réduction) */
  function estimerCompression(sizeBytes) {
    if (sizeBytes > 5 * 1024 * 1024) return Math.round(sizeBytes * 0.55);
    if (sizeBytes > 2 * 1024 * 1024) return Math.round(sizeBytes * 0.65);
    return Math.round(sizeBytes * 0.80);
  }

  function formatTaille(bytes) {
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} Ko`;
    return `${(bytes / (1024 * 1024)).toFixed(2)} Mo`;
  }

  // ── Test Connexion R2 ─────────────────────────────────────
  async function testerConnexionR2() {
    const adminKey = document.getElementById('admin-key').value.trim();
    const backendUrl = document.getElementById('backend-url').value.trim();
    const statusEl = document.getElementById('r2-status');

    if (!adminKey) { afficherToast('Entrez la clé admin.', 'error'); return; }

    statusEl.textContent = '⏳ Test de connexion R2…';

    try {
      const res = await fetch(`${backendUrl}/admin/documents/test-r2`, {
        headers: { 'X-Admin-Key': adminKey },
      });
      const data = await res.json();

      if (data.success) {
        statusEl.innerHTML = `✅ <strong>Connexion R2 opérationnelle</strong> — Bucket : ${data.bucket} — ${data.nombreFichiers} fichier(s) trouvé(s)`;
        statusEl.style.color = 'var(--success)';
        afficherToast('Connexion R2 réussie !', 'success');
      } else {
        statusEl.textContent = `❌ ${data.error}`;
        statusEl.style.color = 'var(--error)';
      }
    } catch (err) {
      statusEl.textContent = `❌ Impossible de joindre le backend : ${err.message}`;
      statusEl.style.color = 'var(--error)';
    }
  }

  // ── Upload ────────────────────────────────────────────────
  async function lancerUpload() {
    const adminKey = document.getElementById('admin-key').value.trim();
    const backendUrl = document.getElementById('backend-url').value.trim();
    const storageKey = document.getElementById('storage-key').value.trim();

    if (!selectedFile) { afficherToast('Sélectionnez un fichier PDF.', 'error'); return; }
    if (!adminKey) { afficherToast('Entrez la clé admin.', 'error'); return; }
    if (!storageKey) { afficherToast('Entrez la clé de stockage R2.', 'error'); return; }

    // Préparer le FormData
    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('storageKey', storageKey);

    const titre = document.getElementById('doc-titre').value.trim();
    const categorie = document.getElementById('doc-categorie').value.trim();
    const niveau = document.getElementById('doc-niveau').value.trim();
    const prix = document.getElementById('doc-prix').value.trim();
    const documentId = document.getElementById('doc-id').value.trim();

    if (titre) formData.append('titre', titre);
    if (categorie) formData.append('categorie', categorie);
    if (niveau) formData.append('niveau', niveau);
    if (prix) formData.append('prix', prix);
    if (documentId) formData.append('documentId', documentId);

    // Afficher la progression
    const progressSection = document.getElementById('progress-section');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    progressSection.style.display = 'block';
    document.getElementById('upload-btn').disabled = true;
    document.getElementById('result-section').style.display = 'none';

    // Animation de progression (simulée — fetch ne rapporte pas la progression upload)
    let progress = 0;
    const progressInterval = setInterval(() => {
      if (progress < 85) {
        progress += Math.random() * 8;
        progressFill.style.width = `${Math.min(progress, 85)}%`;
        progressText.textContent = progress < 30
          ? '🗜️ Compression PDF en cours…'
          : progress < 70
          ? '📤 Upload vers R2 en cours…'
          : '⚡ Synchronisation Supabase…';
      }
    }, 400);

    try {
      const res = await fetch(`${backendUrl}/admin/documents/upload`, {
        method: 'POST',
        headers: { 'X-Admin-Key': adminKey },
        body: formData,
      });

      clearInterval(progressInterval);
      progressFill.style.width = '100%';
      progressText.textContent = '✅ Terminé !';

      const data = await res.json();

      setTimeout(() => {
        progressSection.style.display = 'none';
        progressFill.style.width = '0%';
        afficherResultat(data);
        document.getElementById('upload-btn').disabled = false;
      }, 600);

    } catch (err) {
      clearInterval(progressInterval);
      progressSection.style.display = 'none';
      document.getElementById('upload-btn').disabled = false;
      afficherResultat({ success: false, error: `Erreur réseau : ${err.message}` });
    }
  }

  function afficherResultat(data) {
    const section = document.getElementById('result-section');
    const content = document.getElementById('result-content');
    section.style.display = 'block';

    if (data.success) {
      const c = data.compression || {};
      content.innerHTML = `
        <div class="result-success">
          <div class="result-title">✅ Document uploadé avec succès !</div>
          <div class="result-row">
            <span class="key">Taille originale</span>
            <span class="val">${c.originalSizeMo || '—'}</span>
          </div>
          <div class="result-row">
            <span class="key">Taille optimisée</span>
            <span class="val" style="color:var(--success)">${c.compressedSizeMo || '—'}</span>
          </div>
          <div class="result-row">
            <span class="key">Économie de stockage</span>
            <span class="val" style="color:var(--success)">${c.economiePercent || 0}%</span>
          </div>
          <div class="result-row">
            <span class="key">Taille finale</span>
            <span class="val">${data.tailleMo} Mo</span>
          </div>
          <div class="result-row">
            <span class="key">ID Supabase</span>
            <span class="val">${data.supabaseId || 'Non créé'}</span>
          </div>
          <div style="margin-top:16px;">
            <div class="size-label" style="margin-bottom:6px;">Clé R2 (file_key)</div>
            <div class="file-key-box">${data.fileKey}</div>
          </div>
        </div>`;
      afficherToast(`Upload réussi — ${c.economiePercent || 0}% d'économie !`, 'success');
    } else {
      content.innerHTML = `
        <div class="result-error">
          <div class="result-title">❌ Erreur lors de l'upload</div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:8px;">${data.error || 'Erreur inconnue.'}</div>
        </div>`;
      afficherToast('Échec de l\'upload.', 'error');
    }

    section.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── Toast ─────────────────────────────────────────────────
  let toastTimer = null;
  function afficherToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `visible ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 3500);
  }

  // Auto-focus
  document.getElementById('admin-key').focus();
</script>

</body>
</html>
